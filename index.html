<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirigiendo...</title>
  <style>
    body {
      background: #222;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding-top: 100px;
    }
    a {
      color: #0cf;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h2>Redirigiendo fuera de Instagram...</h2>
  <p>Si no se abre automáticamente, tocá el enlace:</p>
  <a id="manual-link" href="https://cub413.github.io/Cistudiosgame.github.io/" target="_blank">Abrir en navegador</a>

  <script>
    setTimeout(() => {
      // Intentar abrir en ventana externa
      const win = window.open("https://tusitio.com", "_blank");
      if (!win || win.closed || typeof win.closed == "undefined") {
        // Si falla, mostrar mensaje
        document.body.innerHTML += "<p>Si estás en Instagram, tocá los 3 puntos y elegí 'Abrir en navegador'.</p>";
      }
    }, 1000);
  </script>
</body>
</html>
